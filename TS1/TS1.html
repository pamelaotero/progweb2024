<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cálculo da área e circunferência em TypeScript</title>
</head>
<body>
  <script type="module" src="TS1.js"></script>
  <!-- Código transpilado de TypeScript para JavaScript -->

  <form name="myForm">
    <label>Informe o raio</label>
    <input name="ray" type="number" step="0.01" required/>

    <button type="submit">OK</button>
    <br><br>

    <label>Área do círculo</label>
    <input name="circleArea" type="number" readonly/>
    <br><br>
    <label>Circunferência</label>
    <input name="circumference" type="number" readonly/>
  </form>
</body>
</html>
